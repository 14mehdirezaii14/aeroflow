<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="بسته‌بندی فن">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef1f4"/>
      <stop offset="100%" stop-color="#cdd5dd"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8905e"/>
      <stop offset="100%" stop-color="#9d6a3d"/>
    </linearGradient>
  </defs>

  <rect width="400" height="300" rx="18" fill="url(#bg)"/>

  <!-- Box -->
  <rect x="105" y="78" width="190" height="150" rx="8" fill="url(#box)" stroke="#7f5330" stroke-width="3"/>
  <!-- Lid flaps -->
  <path d="M105,78 L200,52 L295,78 Z" fill="#b57e4f" stroke="#7f5330" stroke-width="3"/>
  <path d="M105,78 L130,78 L200,52 Z" fill="#a97447" stroke="#7f5330" stroke-width="2"/>
  <path d="M295,78 L270,78 L200,52 Z" fill="#a97447" stroke="#7f5330" stroke-width="2"/>

  <!-- Fan icon on box -->
  <g>
    <circle cx="200" cy="158" r="34" fill="#f4f1ec" stroke="#6a4a2c" stroke-width="2.5"/>
    <g fill="#8a5a33">
      <ellipse cx="200" cy="158" rx="9" ry="26" transform="rotate(0 200 158)"/>
      <ellipse cx="200" cy="158" rx="9" ry="26" transform="rotate(60 200 158)"/>
      <ellipse cx="200" cy="158" rx="9" ry="26" transform="rotate(120 200 158)"/>
      <ellipse cx="200" cy="158" rx="9" ry="26" transform="rotate(180 200 158)"/>
      <ellipse cx="200" cy="158" rx="9" ry="26" transform="rotate(240 200 158)"/>
      <ellipse cx="200" cy="158" rx="9" ry="26" transform="rotate(300 200 158)"/>
    </g>
    <circle cx="200" cy="158" r="10" fill="#d7dade"/>
    <circle cx="200" cy="158" r="3.5" fill="#6a4a2c"/>
  </g>

  <!-- Tape -->
  <rect x="196" y="78" width="8" height="150" fill="#e5dcd0" opacity="0.85"/>
  <rect x="105" y="146" width="190" height="8" fill="#e5dcd0" opacity="0.85"/>
</svg>
